name: Playwright Tests
on:
  workflow_run:
    workflows: [ "Build Base Docker Image" ]
    types: [ completed ]
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: steveharnadi1994/portfolio-automation-qasteve:base
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    - name: Prepare login credentials
      run: node -e 'const fs = require("node:fs"); const email = process.env.VALID_LOGIN_EMAIL; const password = process.env.VALID_LOGIN_PASSWORD; if (!email || !password) throw new Error("Login credential secrets are required"); fs.mkdirSync("data", { recursive: true }); fs.writeFileSync("data/user.json", JSON.stringify({ VALID_LOGIN_EMAIL: email, VALID_LOGIN_PASSWORD: password }, null, 2));'
      env:
        VALID_LOGIN_EMAIL: ${{ secrets.LOGIN_VALID_EMAIL }}
        VALID_LOGIN_PASSWORD: ${{ secrets.LOGIN_VALID_PASSWORD }}

    - name: Prepare AgentQ credentials
      run: node -e 'const fs = require("node:fs"); const agentq_credential = { email: process.env.AGENTQ_EMAIL, password: process.env.AGENTQ_PASSWORD, token: process.env.AGENTQ_TOKEN, project_id: process.env.AGENTQ_PROJECT_ID, testrun_id: process.env.AGENTQ_TESTRUN_ID }; fs.mkdirSync("data", { recursive: true }); fs.writeFileSync("data/agentq.json", JSON.stringify({ agentq_credential }, null, 2));'
      env:
        AGENTQ_PROJECT_ID: ${{ secrets.AGENTQ_PROJECT_ID }}
        AGENTQ_TESTRUN_ID: ${{ secrets.AGENTQ_TESTRUN_ID }}
        AGENTQ_EMAIL: ${{ vars.AGENTQ_EMAIL }}
        AGENTQ_PASSWORD: ${{ secrets.AGENTQ_PASSWORD }}
        AGENTQ_TOKEN: ${{ secrets.AGENTQ_TOKEN }}

    - name: Run Playwright tests
      run: npx playwright test
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
